name: Uptime Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency: monitor

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production (alert on real failure)
        run: |
          FAIL=1
          for i in 1 2 3; do
            echo "[Attempt $i] $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 https://www.culture-of-china.com/api/health)
            echo "HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "OK - app is healthy"
              FAIL=0
              break
            fi
            echo "Retry in 20s..."
            sleep 20
          done
          exit $FAIL
